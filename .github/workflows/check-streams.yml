name: Radyo yayınlarını kontrol et

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: radyot-stream-health
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Yayınları kontrol et
        run: python scripts/check_streams.py

      - name: Sonuç değiştiyse kaydet
        run: |
          if git diff --quiet -- health.json; then
            echo "Sağlık sonucu değişmedi."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add health.json
          git commit -m "Yayın sağlık sonuçlarını güncelle"
          git push
