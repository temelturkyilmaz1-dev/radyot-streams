name: Cloudflare salt okunur bağlantı testi

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify_connection:
    name: Cloudflare KV erişimini doğrula
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cloudflare KV namespace bilgilerini salt okunur doğrula
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          : "${ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID secret eksik}"
          : "${NAMESPACE_ID:?CLOUDFLARE_KV_NAMESPACE_ID secret eksik}"
          : "${API_TOKEN:?CLOUDFLARE_API_TOKEN secret eksik}"

          response="$(curl --fail-with-body --silent --show-error \
            --request GET \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/storage/kv/namespaces/${NAMESPACE_ID}" \
            --header "Authorization: Bearer ${API_TOKEN}")"

          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True, "Cloudflare API isteği başarısız"; r=d.get("result") or {}; print("Cloudflare KV bağlantısı başarılı:", r.get("title", "namespace bulundu"))' <<< "$response"
