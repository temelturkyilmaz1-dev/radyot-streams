name: Katalogu Cloudflare'e aktar

on:
  push:
    branches:
      - main
    paths:
      - stations.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: GitHub dosyalarını al
        uses: actions/checkout@v4

      - name: JSON dosyasını kontrol et
        run: |
          python - <<'PY'
          import json

          with open("stations.json", encoding="utf-8") as file:
              data = json.load(file)

          stations = data.get("stations")
          if not isinstance(stations, list) or not stations:
              raise SystemExit("stations.json içinde istasyon listesi bulunamadı.")

          print(f"JSON kontrol edildi. İstasyon sayısı: {len(stations)}")
          PY

      - name: Cloudflare KV'ye yükle
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          response_file="$(mktemp)"

          http_code="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request PUT \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary "@stations.json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${CLOUDFLARE_KV_NAMESPACE_ID}/values/stations.json")"

          if [ "$http_code" != "200" ] || ! jq -e '.success == true' "$response_file" >/dev/null; then
            cat "$response_file"
            exit 1
          fi

          echo "stations.json Cloudflare KV'ye yüklendi."
